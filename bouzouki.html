<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instrument Tuner</title>
  <link rel="stylesheet" href="tuner.css" />
</head>
<body data-instrument="bouzouki">
  <main class="phone">
    <div class="stage">
      <canvas class="pitch-trail" id="pitchTrail" aria-hidden="true"></canvas>

      <header class="tuner-header" aria-label="Tuner navigation">
        <a class="back-link" href="index.html" aria-label="Back to instrument list">‹</a>
        <div class="brand-lockup" aria-hidden="true">
          <span class="logo-mark">t</span>
          <span>instrument tuna</span>
        </div>
        <div class="page-title">
          <strong id="instrumentTitle">Instrument</strong>
          <span id="tuningTitle">Standard</span>
        </div>
        <a class="github-link" href="https://github.com/magic-bunny/ukelele-helper" target="_blank" rel="noopener noreferrer" aria-label="Open project on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-1.04-.01-1.88-2.78.62-3.37-1.22-3.37-1.22-.45-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.93.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0 1 12 7c.85 0 1.7.12 2.5.34 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.38-.01 2.49-.01 2.83 0 .27.18.59.69.49A10.23 10.23 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z" />
          </svg>
        </a>
      </header>

      <div class="tuning-switch" id="tuningSwitch" aria-label="Tuning mode"></div>

      <section class="meter-zone" aria-live="polite">
        <div class="center-line" id="needle" aria-hidden="true"></div>
        <div class="tuner-scale" aria-hidden="true">
          <div class="readout" id="tuneIcon"></div>
          <div class="scale-ticks" id="scaleTicks"></div>
          <div class="scale-labels">
            <span style="left: 25%">-50</span>
            <span style="left: 50%">0</span>
            <span style="left: 75%">+50</span>
          </div>
        </div>
        <span class="flat">♭</span>
        <span class="sharp">♯</span>
      </section>

      <section class="headstock-scene" aria-label="Instrument strings">
        <div id="stringButtons"></div>
        <div class="instrument-body" aria-hidden="true">
          <div class="body-shine"></div>
          <div class="soundhole"></div>
          <div class="tailpiece"></div>
        </div>
        <div class="headstock" aria-hidden="true">
          <div class="wood"></div>
          <div class="brand" id="brandText">TUNER</div>
          <div class="nut"></div>
          <div class="fretboard"></div>
        </div>
      </section>

      <section class="bottom-panel" aria-live="polite">
        <div class="bottom-status">
          <strong id="noteName">—</strong>
          <span id="targetText">Waiting for microphone</span><br />
          <span id="freqText">-- Hz</span> · <span><b id="centsText">0</b> cents</span><br />
          <span id="direction">Play an open string</span>
        </div>
      </section>

      <div class="volume-signal" aria-label="Input level" title="Input level">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
  </main>
  <script src="tuner.js"></script>
</body>
</html>
